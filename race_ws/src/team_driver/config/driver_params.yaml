# Every tunable the driver has. Loaded with:
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# or in a scored run:
#   ./scripts/evaluate.sh --team my_team --driver-params <path to a copy of this>
#
# Nothing here requires a rebuild, which is the whole point: lab/sweep.py
# writes variants of this file and evaluate.sh takes them directly. If you
# find yourself editing code to try a number, the number belongs here.

driver:
  ros__parameters:

    vehicle_ns: "/autodrive/roboracer_1"

    # Path to the identified vehicle parameters. Blank means the copy
    # installed with the package. Until tools/sysid_drive.py has run, that
    # file has measured=false and its limits are assumed, not measured - the
    # node warns about it on startup.
    vehicle_config: ""

    gap:
      # Clip the scan here. The LiDAR reaches 10 m.
      max_range: 10.0

      # Half the car's width (0.135 m) plus margin, used by disparity
      # extension. THE most sensitive number in this file. The corridor
      # narrows to about 0.90 m for a 0.27 m car, so the margin you add and
      # the bubble radius below interact: too generous and every gap the car
      # could have driven through gets closed off, leaving it crawling into
      # things slowly; too tight and it clips ducts. There is a real optimum
      # and the only way to find it is to run it.
      car_half_width: 0.20

      # The near/far step, in metres, that counts as a disparity.
      disparity_threshold: 0.3

      # Radius of the blanked arc around the closest return.
      bubble_radius: 0.35

      # A beam counts as open at this fraction of the deepest reading left
      # after preprocessing.
      gap_threshold_frac: 0.55

      # Half-angle of the cone used to measure clearance straight ahead.
      forward_cone_rad: 0.26

      # Clearance we insist on still having in hand when stopped, in metres.
      stop_margin: 0.35

      # Speed floor. A car that stops for 15 simulated seconds is a DNF, so
      # this never goes to zero.
      v_min: 0.5

      # Speed ceiling asked of the controller.
      v_max: 6.0

      # How much of v_max a full-lock steering angle gives up.
      steer_speed_gain: 0.7

    speed:
      # Feed-forward does most of the work; these only trim it.
      kp: 0.05
      ki: 0.15

      # Hard clamp on the integral, in throttle units. One slow corner is
      # otherwise enough to hold the throttle open down the next straight.
      integral_limit: 0.30

      # How far over target we coast before braking, in m/s. Small on
      # purpose: coasting through a 0.5 m/s overspeed starts the braking
      # late and cost about 0.2 s a lap in tuning. The car has no ABS, so a
      # negative throttle locks the wheels - but arriving at the corner
      # too fast is the more expensive failure.
      lift_band: 0.15

      # Throttle per m/s of excess once past the lift band. The speed
      # profile plans braking at a_brake_max, so this must be high enough
      # that the controller can actually ask for it.
      brake_gain: 1.0

      # Below the target by more than this, in m/s, the throttle goes to 1.0.
      # 0 disables it. The speed profile plans every acceleration at the
      # traction limit, so under-target is lost time; feed-forward plus a
      # trim creeps up on the target instead of driving at it.
      full_throttle_band: 0.0

      # Read the target speed this many seconds of travel ahead of the car,
      # covering actuation and pose latency so braking starts on time.
      # 0 reads it at the car's own position.
      preview_s: 0.0

      # Full-throttle band only while lateral load v^2*|k| on the line is
      # below this, m/s^2 (0 = no limit). Prevents power-on understeer on
      # corner exits, where every real collision happened.
      full_throttle_max_lat: 0.0

    # ---- the racing line -------------------------------------------------
    line:
      # Blank searches /hackathon/maps for the generated racing line, then
      # falls back to the shipped centreline. Regenerate the line with:
      #   python3 -m team_driver.tools.build_raceline --map ... --out ...
      raceline_csv: ""

      # How much of a_lat_max the speed profile asks for. This is a safety
      # margin against a_lat_max ITSELF being wrong, which it currently is:
      # vehicle.json says measured=false and 6.0 m/s^2 is a guess.
      #
      # 0.70 is conservative on purpose. It stays clean even if the real grip
      # is 30% below the assumption. Once sysid has measured a_lat_max, raise
      # this to 0.85 - it is clean at every grip level we tested and worth
      # about 0.3 s a lap.
      #
      # An earlier comment here claimed a cliff above 0.35. That was wrong:
      # it was an artifact of brake_gain being 0.30 in PlannerConfig while
      # the parameter map said 1.0, so every offline run braked at a third
      # authority and arrived at corners too fast. Fixed; the cliff is gone.
      grip_fraction: 0.70

      # Ceiling on the profile's target speed, m/s. NOT a safety limit - the
      # grip-limited cornering speed already handles that - just a cap so a
      # nearly-straight section cannot ask for something absurd.
      #
      # It was 6.0, which quietly cost 1.6 s a lap at realistic grip: the
      # profile wants peaks near 14 m/s down the straights and was being
      # clipped to 6. Above 12 it makes no measurable difference.
      v_max: 12.0

    # ---- path tracking ---------------------------------------------------
    pursuit:
      # Lookahead is min + k * speed, then capped at curvature_cap / |kappa|.
      k_lookahead: 0.35
      min_lookahead: 0.45
      max_lookahead: 2.0
      # Aiming further ahead than the corner radius tracks a chord across the
      # corner instead of round it. This circuit turns at about 1.1 m.
      curvature_cap: 0.8

      # Which tracker: "feedforward" reads the steering angle out of the
      # path's curvature a preview ahead, so the actuator is given its lag up
      # front instead of spending it catching up. "pursuit" is classic pure
      # pursuit, which only turns once error already exists - on 0.83 m
      # corners that arrives after the corner does.
      tracker: "feedforward"
      tau_preview: 0.16      # seconds of travel to read curvature ahead
      min_preview: 0.25
      max_preview: 2.5
      k_heading: 0.7         # weight on heading error
      k_cross: 2.2           # weight on cross-track error, divided by speed

    # ---- when to give up on the line ------------------------------------
    mode:
      # Distance from the line past which we stop believing it, m.
      max_path_offset: 1.2
      # A LiDAR return within this of the path ahead is an obstruction, m.
      # Must stay well under the corridor half-width (~0.67 m at its
      # tightest) or the boundary itself reads as an obstacle.
      block_radius: 0.30
      block_min_horizon: 1.5
      block_samples: 8
      # Hysteresis in frames at 40 Hz: quick to duck, slow to commit back.
      block_enter_frames: 3
      block_exit_frames: 10
