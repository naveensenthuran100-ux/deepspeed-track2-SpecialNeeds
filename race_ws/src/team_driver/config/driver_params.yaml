# Every tunable the driver has. Loaded with:
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# or in a scored run:
#   ./scripts/evaluate.sh --team my_team --driver-params <path to a copy of this>
#
# Nothing here requires a rebuild, which is the whole point: lab/sweep.py
# writes variants of this file and evaluate.sh takes them directly. If you
# find yourself editing code to try a number, the number belongs here.

driver:
  ros__parameters:

    vehicle_ns: "/autodrive/roboracer_1"

    # Path to the identified vehicle parameters. Blank means the copy
    # installed with the package. Until tools/sysid_drive.py has run, that
    # file has measured=false and its limits are assumed, not measured - the
    # node warns about it on startup.
    vehicle_config: ""

    gap:
      # Clip the scan here. The LiDAR reaches 10 m.
      max_range: 10.0

      # Half the car's width (0.135 m) plus margin, used by disparity
      # extension. THE most sensitive number in this file. The corridor
      # narrows to about 0.90 m for a 0.27 m car, so the margin you add and
      # the bubble radius below interact: too generous and every gap the car
      # could have driven through gets closed off, leaving it crawling into
      # things slowly; too tight and it clips ducts. There is a real optimum
      # and the only way to find it is to run it.
      car_half_width: 0.20

      # The near/far step, in metres, that counts as a disparity.
      disparity_threshold: 0.3

      # Radius of the blanked arc around the closest return.
      bubble_radius: 0.35

      # A beam counts as open at this fraction of the deepest reading left
      # after preprocessing.
      gap_threshold_frac: 0.55

      # Half-angle of the cone used to measure clearance straight ahead.
      forward_cone_rad: 0.26

      # Clearance we insist on still having in hand when stopped, in metres.
      stop_margin: 0.35

      # Speed floor. A car that stops for 15 simulated seconds is a DNF, so
      # this never goes to zero.
      v_min: 0.5

      # Speed ceiling asked of the controller.
      v_max: 6.0

      # How much of v_max a full-lock steering angle gives up.
      steer_speed_gain: 0.7

    speed:
      # Feed-forward does most of the work; these only trim it.
      kp: 0.05
      ki: 0.15

      # Hard clamp on the integral, in throttle units. One slow corner is
      # otherwise enough to hold the throttle open down the next straight.
      integral_limit: 0.30

      # How far over target we coast before braking, in m/s. The car has no
      # ABS: a negative throttle locks the wheels and a locked wheel steers
      # nowhere.
      lift_band: 0.5

      # Throttle per m/s of excess once past the lift band. The speed
      # profile plans braking at a_brake_max, so this must be high enough
      # that the controller can actually ask for it.
      brake_gain: 1.0
